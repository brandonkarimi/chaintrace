[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaintrace"
version = "0.1.0"
description = "Open-source Bitcoin fund-flow tracing and forensic analysis platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chaintrace = "chaintrace.cli:main"

[tool.setuptools.packages.find]
include = ["chaintrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
